name: Integrate Repeat Family Smooth

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-repeat-family:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Integrate Repeat Family
        run: python scripts/integrate_repeat_family_smooth.py

      - name: Save
        run: |
          git config user.name "4D App Updater"
          git config user.email "actions@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Integrate repeat family smoothly"
            git push
          fi
