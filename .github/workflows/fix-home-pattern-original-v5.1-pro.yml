name: Fix Home Pattern Keep Original V5.1 PRO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-tabs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Home and Pattern behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("index.html")
          if not p.exists():
              raise SystemExit("index.html not found")

          s = p.read_text(encoding="utf-8")
          MARK = "FIX-HOME-PATTERN-ORIGINAL-V1"

          if MARK in s:
              print("Fix already installed")
              raise SystemExit(0)

          js = r'''
          <script>
          /* FIX-HOME-PATTERN-ORIGINAL-V1 */
          (function(){
            "use strict";

            function clean(v){
              return (v||"").replace(/\s+/g," ").trim().toUpperCase();
            }

            function refs(){
              const favBody=document.getElementById("favBody");
              const favCard=favBody ? favBody.closest(".card") : null;
              const cards=[...document.querySelectorAll(".app > .card")];

              const inputCard=cards.find(c=>{
                const u=clean(c.textContent);
                return u.includes("MANUAL CHARTA") || u.includes("AUTO CHARTA") || u.includes("CHARTA LINES");
              }) || cards[0] || null;

              return {
                inputCard,
                favCard,
                analysis:document.querySelector(".app > .analysis-card"),
                perm:document.querySelector(".app > .permutation-card"),
                history:document.querySelector(".app > .history-card"),
                footer:document.querySelector(".app > .footer"),
                results:document.getElementById("v51ResultsPage"),
                generator:document.getElementById("vPowerGeneratorPage") ||
                          document.getElementById("powerGeneratorPage")
              };
            }

            function hide(el){
              if(!el)return;
              el.classList.add("vTabHidden");
              el.classList.remove("vTabVisible");
              el.classList.add("v46-hidden-mobile");
            }

            function show(el){
              if(!el)return;
              el.classList.remove("vTabHidden");
              el.classList.remove("v46-hidden-mobile");
              el.classList.add("vTabVisible");
            }

            function applyTab(tab){
              if(window.innerWidth>1100)return;

              const r=refs();
              const all=[r.inputCard,r.favCard,r.analysis,r.perm,r.history,r.footer,r.results,r.generator];

              if(tab==="home"){
                all.forEach(hide);
                [r.inputCard,r.favCard,r.analysis].forEach(show);
              }
              else if(tab==="pattern"){
                all.forEach(hide);
                [r.analysis,r.perm].forEach(show);
              }
              else if(tab==="history"){
                all.forEach(hide);
                show(r.history);
              }
              else if(tab==="generator"){
                all.forEach(hide);
                show(r.generator);
              }
              else if(tab==="results"){
                all.forEach(hide);
                show(r.results);
              }
              else if(tab==="all"){
                all.forEach(show);
              }

              const nav=document.querySelector(".v46-bottom-nav");
              if(nav){
                nav.querySelectorAll(".v46-nav-btn").forEach(b=>{
                  b.classList.toggle("active",b.dataset.tab===tab);
                });
              }
            }

            function bind(){
              const nav=document.querySelector(".v46-bottom-nav");
              if(!nav)return false;
              if(nav.dataset.fixHomePatternBound==="1")return true;

              nav.dataset.fixHomePatternBound="1";
              nav.addEventListener("click",function(e){
                const btn=e.target.closest(".v46-nav-btn");
                if(!btn || !btn.dataset.tab)return;
                const tab=btn.dataset.tab;

                // Run after older tab handlers so this final state wins.
                setTimeout(function(){
                  applyTab(tab);
                  window.scrollTo({top:0,behavior:"smooth"});
                },80);
              },false);

              const active=nav.querySelector(".v46-nav-btn.active");
              setTimeout(()=>applyTab(active?.dataset.tab || "home"),120);
              return true;
            }

            document.addEventListener("DOMContentLoaded",function(){
              let tries=0;
              const t=setInterval(function(){
                tries++;
                if(bind() || tries>100)clearInterval(t);
              },100);
            });
          })();
          </script>
          '''

          if "</body>" not in s:
              raise SystemExit("closing body not found")

          s=s.replace("</body>",js+"\n</body>",1)
          p.write_text(s,encoding="utf-8")
          print("Home + Pattern restored; History/Generator/Results remain single-page ✓")
          PY

      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          assert "FIX-HOME-PATTERN-ORIGINAL-V1" in s
          assert '[r.inputCard,r.favCard,r.analysis].forEach(show)' in s
          assert '[r.analysis,r.perm].forEach(show)' in s
          print("VALID ✓")
          PY

      - name: Bump service worker cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path("sw.js")
          if p.exists():
              s=p.read_text(encoding="utf-8")
              s2=re.sub(r'4d-charta-v[^"\']+', '4d-charta-v51-tabs2', s, count=1)
              if s2==s:
                  s=s.replace("const CACHE_NAME =", "const CACHE_NAME = '4d-charta-v51-tabs2'; // ", 1)
              else:
                  s=s2
              p.write_text(s,encoding="utf-8")
              print("SW cache bumped")
          else:
              print("No sw.js - skipped")
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          [ -f sw.js ] && git add sw.js || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Restore Home Pattern tab behavior"
            git push
          fi
