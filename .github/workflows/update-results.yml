name: Build 2021-2026 History

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Build History Database
        run: python scripts/build_history.py

      - name: Save History Database
        run: |
          git config user.name "4D History Builder"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json

          if git diff --cached --quiet; then
            echo "No database changes"
          else
            git commit -m "Build 2021-2026 history database"
            git push
          fi
