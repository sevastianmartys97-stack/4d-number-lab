name: Auto Update 4D Results

on:
  schedule:
    - cron: "15 11 * * *"
    - cron: "15 13 * * *"
    - cron: "15 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests beautifulsoup4

      - name: Update Results
        run: python scripts/update_results.py

      - name: Save Results
        run: |
          git config user.name "4D Auto Updater"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No new results"
          else
            git commit -m "Auto update 4D results"
            git push
          fi
