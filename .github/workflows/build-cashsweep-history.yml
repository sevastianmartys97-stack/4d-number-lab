name: Build Cash Sweep 2021-2026

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cashsweep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests beautifulsoup4

      - name: Build Cash Sweep History
        run: python scripts/build_cashsweep_history.py

      - name: Save Cash Sweep Database
        run: |
          git config user.name "4D Cash Sweep Builder"
          git config user.email "actions@users.noreply.github.com"

          git add data/cashsweep.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build Cash Sweep 2021-2026 history"
            git push
          fi
