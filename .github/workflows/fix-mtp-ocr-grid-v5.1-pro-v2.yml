name: Fix MTP OCR Grid V5.1 PRO v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-mtp-ocr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y tesseract-ocr
          python3 -m pip install requests beautifulsoup4 opencv-python-headless pytesseract numpy

      - name: Patch OCR extractor
        run: |
          echo "" | base64 -d > /tmp/fix_mtp_ocr.py
          python3 /tmp/fix_mtp_ocr.py

      - name: Run scanner
        run: |
          python3 scripts/update_mtp_charta.py

      - name: Validate latest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/mtp-charta.json").read_text(encoding="utf-8"))
          entries=sorted(d.get("entries",[]), key=lambda e:e["date"], reverse=True)
          assert entries, "No MTP entries"
          assert all(len(e.get("numbers",[]))==16 for e in entries)
          print("LATEST SAVED:",entries[0]["date"],"".join(map(str,entries[0]["numbers"])))
          if entries[0]["date"] < "2026-09-12":
              raise SystemExit("OCR still failed to save 2026-09-12")
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update_mtp_charta.py data/mtp-charta.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix MTP OCR grid extraction v2"
            git push
          fi
