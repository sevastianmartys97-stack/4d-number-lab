name: Auto MTP Direct Image V1

"on":
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: auto-mtp-direct-image-v1
  cancel-in-progress: true

jobs:
  mtp-direct-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch latest MTP image
        run: |
          python3 - <<'PY'
          import json
          import re
          import requests
          from bs4 import BeautifulSoup
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          FEED = (
              "https://cartaplanbee.blogspot.com/"
              "feeds/posts/default?alt=json&max-results=50"
          )

          DB = Path("data/mtp-charta.json")

          headers = {
              "User-Agent": "Mozilla/5.0"
          }

          print("==========================================")
          print("MTP DIRECT IMAGE V1")
          print("==========================================")

          r = requests.get(
              FEED,
              headers=headers,
              timeout=30
          )

          r.raise_for_status()

          feed = r.json()

          entries = feed.get("feed",{}).get("entry",[])

          print("FEED ENTRIES:",len(entries))

          mtp_posts=[]

          for entry in entries:

              title = entry.get("title",{}).get("$t","")

              if "MTP" not in title.upper():
                  continue

              text = title

              # ------------------------------------------------------
              # Find MTP date from title
              # Example:
              # MTP 04.10.2026 CARTA DAN 4D HIT RAMALAN
              # ------------------------------------------------------

              m = re.search(
                  r"MTP\s+(\d{2})[./-](\d{2})[./-](20\d{2})",
                  text,
                  re.I
              )

              if not m:
                  continue

              date = (
                  f"{m.group(3)}-"
                  f"{m.group(2)}-"
                  f"{m.group(1)}"
              )

              content = entry.get("content",{}).get("$t","")

              soup = BeautifulSoup(
                  content,
                  "html.parser"
              )

              images=[]

              for img in soup.find_all("img"):

                  src = (
                      img.get("src")
                      or img.get("data-src")
                      or img.get("data-original")
                  )

                  if not src:
                      continue

                  if src.startswith("//"):
                      src="https:"+src

                  if not src.startswith("http"):
                      continue

                  # Prefer Blogger hosted images
                  if "blogger.googleusercontent.com" in src:
                      images.append(src)
                  else:
                      images.append(src)

              if not images:
                  print("NO IMAGE:",date)
                  continue

              # Remove duplicates while keeping order
              unique=[]

              for x in images:
                  if x not in unique:
                      unique.append(x)

              mtp_posts.append({
                  "date":date,
                  "title":title,
                  "images":unique
              })

          if not mtp_posts:
              raise SystemExit(
                  "NO MTP POSTS FOUND"
              )

          mtp_posts.sort(
              key=lambda x:x["date"],
              reverse=True
          )

          latest=mtp_posts[0]

          print("LATEST MTP:",latest["date"])
          print("TITLE:",latest["title"])
          print("IMAGE COUNT:",len(latest["images"]))

          for i,img in enumerate(
              latest["images"][:10],
              1
          ):
              print(
                  "IMAGE",
                  i,
                  ":",
                  img
              )

          # ------------------------------------------------------
          # Load database
          # ------------------------------------------------------

          if DB.exists():

              data=json.loads(
                  DB.read_text(
                      encoding="utf-8"
                  )
              )

          else:

              data={
                  "source":"CARTAPLANBEE MTP ONLY",
                  "entries":[]
              }

          db_entries=data.setdefault(
              "entries",
              []
          )

          # ------------------------------------------------------
          # IMPORTANT VERIFIED 04/10
          #
          # From the actual MTP chart supplied by user:
          #
          # 1 0 4 3
          # 9 8 1 7
          # 5 2 3 9
          # 9 6 8 5
          #
          # Flat:
          # 1043981752399685
          # ------------------------------------------------------

          if latest["date"]=="2026-10-04":

              numbers=list(
                  "1043981752399685"
              )

              image_url=latest["images"][0]

              existing=next(
                  (
                      x for x in db_entries
                      if x.get("date")=="2026-10-04"
                  ),
                  None
              )

              record={
                  "date":"2026-10-04",
                  "numbers":numbers,
                  "image_url":image_url,
                  "source":"CARTAPLANBEE-MTP-DIRECT-IMAGE",
                  "verified":True,
                  "auto":True
              }

              if existing:
                  existing.update(record)
                  print("04/10 VERIFIED RECORD UPDATED")
              else:
                  db_entries.append(record)
                  print("04/10 VERIFIED RECORD ADDED")

              print(
                  "04/10:",
                  "1043 / 9817 / 5239 / 9685"
              )

          else:

              # --------------------------------------------------
              # For future MTP dates:
              # keep existing numbers if already available,
              # but attach the REAL source image.
              # --------------------------------------------------

              existing=next(
                  (
                      x for x in db_entries
                      if x.get("date")==latest["date"]
                  ),
                  None
              )

              image_url=latest["images"][0]

              if existing:

                  existing["image_url"]=image_url

                  print(
                      "IMAGE UPDATED:",
                      latest["date"]
                  )

              else:

                  print(
                      "NEW MTP IMAGE FOUND:",
                      latest["date"]
                  )

                  print(
                      "IMAGE ATTACHED WITHOUT "
                      "GUESSING NUMBERS"
                  )

                  db_entries.append({
                      "date":latest["date"],
                      "numbers":[],
                      "image_url":image_url,
                      "source":"CARTAPLANBEE-MTP-DIRECT-IMAGE",
                      "verified":False,
                      "auto":True
                  })

          # ------------------------------------------------------
          # Remove invalid empty-number records from old logic
          # only when they are not the latest image record.
          # ------------------------------------------------------

          cleaned=[]

          for x in db_entries:

              if not x.get("date"):
                  continue

              cleaned.append(x)

          db_entries=cleaned

          db_entries.sort(
              key=lambda x:x.get("date",""),
              reverse=True
          )

          data["entries"]=db_entries
          data["source"]="CARTAPLANBEE MTP ONLY"

          MYT=timezone(
              timedelta(hours=8)
          )

          data["updated_at"]=datetime.now(
              MYT
          ).isoformat(
              timespec="seconds"
          )

          DB.write_text(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("==========================================")
          print(
              "LATEST IMAGE SAVED:",
              latest["date"]
          )
          print("==========================================")
          PY

      - name: Add MTP image viewer to app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          marker="MTP-DIRECT-IMAGE-V1"

          if marker in s:
              print("MTP image viewer already installed")
              raise SystemExit(0)

          css=r'''
          <style id="MTP-DIRECT-IMAGE-CSS">
          /* MTP-DIRECT-IMAGE-V1 */

          .mtp-direct-image-card{
            margin-top:10px;
            padding:10px;
            border:1px solid #234b63;
            border-radius:14px;
            background:#061521;
          }

          .mtp-direct-image-head{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:8px;
            margin-bottom:8px;
          }

          .mtp-direct-image-title{
            color:#dceaf3;
            font-size:12px;
            font-weight:800;
          }

          .mtp-direct-image-badge{
            color:#78e79a;
            border:1px solid #28633d;
            background:#09271a;
            border-radius:99px;
            padding:4px 7px;
            font-size:8px;
            font-weight:800;
          }

          .mtp-direct-image-date{
            color:#ffc62e;
            font-size:10px;
            font-weight:800;
            margin-bottom:7px;
          }

          .mtp-direct-image-wrap{
            width:100%;
            border-radius:11px;
            overflow:hidden;
            background:#02080d;
            border:1px solid #1c3c50;
          }

          .mtp-direct-image{
            display:block;
            width:100%;
            height:auto;
            max-height:520px;
            object-fit:contain;
            margin:0 auto;
          }

          .mtp-direct-image-note{
            margin-top:7px;
            color:#7892a3;
            font-size:8px;
            line-height:1.35;
            text-align:center;
          }

          .mtp-direct-image-loading{
            padding:18px 8px;
            text-align:center;
            color:#7892a3;
            font-size:9px;
          }

          .mtp-direct-image-error{
            padding:14px 8px;
            text-align:center;
            color:#ff9a9a;
            font-size:9px;
          }
          </style>
          '''

          js=r'''
          <script id="MTP-DIRECT-IMAGE-V1">
          /* MTP-DIRECT-IMAGE-V1 */

          (function(){

            const DB_URL="data/mtp-charta.json";

            const FALLBACK_0410=
              "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjhK7cEY269PNcQS3EM_z-MaRtKIDccA65G3CioFTjLMBf9EQJOWIsypgOtZ06_jgPZ-ml6KLzWcZMuKVww2Av8IAqGBvaOYvoiQfwyaZR57AoZ5tgyqqfAQZLDWunmemJt_5g6Ef3DywLOJZa6DkTBbFL_9xYL6T8yMeQkXkh9rGBk0Tt90XacWw0L1oAm/s1600/IMG_1791089634649.jpg";

            function nice(date){

              const m=String(date||"").match(
                /^(\\d{4})-(\\d{2})-(\\d{2})$/
              );

              return m
                ? `${m[3]}/${m[2]}/${m[1]}`
                : date;
            }

            function getSelectedDate(){

              const s=
                document.getElementById(
                  "mtpDateSelect"
                );

              if(s && s.value){
                return s.value;
              }

              return "";
            }

            function makeCard(){

              if(
                document.getElementById(
                  "mtpDirectImageCard"
                )
              ){
                return document.getElementById(
                  "mtpDirectImageCard"
                );
              }

              const card=
                document.createElement("div");

              card.id=
                "mtpDirectImageCard";

              card.className=
                "mtp-direct-image-card";

              card.innerHTML=`

                <div class="mtp-direct-image-head">

                  <div class="mtp-direct-image-title">
                    🖼️ MTP CHARTA • GAMBAR SEBENAR
                  </div>

                  <div class="mtp-direct-image-badge">
                    LIVE ✓
                  </div>

                </div>

                <div
                  id="mtpDirectImageDate"
                  class="mtp-direct-image-date">
                  MTP
                </div>

                <div
                  id="mtpDirectImageBody"
                  class="mtp-direct-image-wrap">

                  <div
                    class="mtp-direct-image-loading">
                    Memuatkan gambar carta...
                  </div>

                </div>

                <div
                  class="mtp-direct-image-note">
                  Sumber gambar terus daripada CARTAPLANBEE MTP.
                  Gambar ini menjadi rujukan carta sebenar.
                </div>
              `;

              const select=
                document.getElementById(
                  "mtpDateSelect"
                );

              if(select){

                const parent=
                  select.parentElement;

                if(parent){

                  parent.after(card);

                }else{

                  document.body.prepend(card);

                }

              }else{

                document.body.prepend(card);

              }

              return card;
            }

            async function loadImage(){

              const card=makeCard();

              const date=
                getSelectedDate();

              const dateEl=
                document.getElementById(
                  "mtpDirectImageDate"
                );

              const body=
                document.getElementById(
                  "mtpDirectImageBody"
                );

              if(!body)return;

              body.innerHTML=
                `<div class="mtp-direct-image-loading">
                  Memuatkan gambar carta...
                </div>`;

              try{

                const r=
                  await fetch(
                    DB_URL+
                    "?v="+
                    Date.now(),
                    {
                      cache:"no-store"
                    }
                  );

                if(!r.ok){
                  throw new Error(
                    "HTTP "+r.status
                  );
                }

                const data=
                  await r.json();

                const entries=
                  Array.isArray(data.entries)
                  ? data.entries
                  : [];

                let selected=
                  entries.find(
                    e =>
                      e &&
                      e.date===date &&
                      e.image_url
                  );

                // Fallback for verified 04/10
                if(
                  !selected &&
                  date==="2026-10-04"
                ){

                  selected={
                    date:"2026-10-04",
                    image_url:FALLBACK_0410
                  };

                }

                // If selected date has no image,
                // show newest image available.
                if(!selected){

                  const sorted=
                    entries
                    .filter(
                      e =>
                        e &&
                        e.image_url
                    )
                    .sort(
                      (a,b)=>
                        String(b.date)
                        .localeCompare(
                          String(a.date)
                        )
                    );

                  selected=
                    sorted[0] || null;

                }

                if(!selected){

                  body.innerHTML=
                    `<div class="mtp-direct-image-error">
                      Gambar MTP belum tersedia.
                    </div>`;

                  if(dateEl){
                    dateEl.textContent=
                      "MTP";
                  }

                  return;

                }

                if(dateEl){

                  dateEl.textContent=
                    nice(selected.date)+
                    " • MTP";

                }

                const img=
                  document.createElement(
                    "img"
                  );

                img.className=
                  "mtp-direct-image";

                img.alt=
                  "MTP Charta "+
                  nice(selected.date);

                img.loading="eager";

                img.referrerPolicy=
                  "no-referrer";

                img.src=
                  selected.image_url;

                img.onload=function(){

                  body.innerHTML="";
                  body.appendChild(img);

                };

                img.onerror=function(){

                  body.innerHTML=
                    `<div class="mtp-direct-image-error">
                      Gambar carta tidak dapat dimuat.
                    </div>`;

                };

              }catch(err){

                console.warn(
                  "MTP DIRECT IMAGE",
                  err
                );

                body.innerHTML=
                  `<div class="mtp-direct-image-error">
                    Gagal memuatkan gambar MTP.
                  </div>`;

              }

            }

            function install(){

              makeCard();

              loadImage();

              const select=
                document.getElementById(
                  "mtpDateSelect"
                );

              if(select){

                select.addEventListener(
                  "change",
                  function(){

                    setTimeout(
                      loadImage,
                      50
                    );

                  }
                );

              }

            }

            function start(){

              install();

              setInterval(
                loadImage,
                5*60*1000
              );

              document.addEventListener(
                "visibilitychange",
                function(){

                  if(!document.hidden){
                    loadImage();
                  }

                }
              );

              window.addEventListener(
                "focus",
                loadImage
              );

            }

            if(
              document.readyState===
              "loading"
            ){

              document.addEventListener(
                "DOMContentLoaded",
                start
              );

            }else{

              start();

            }

          })();
          </script>
          '''

          if "</head>" not in s:
              raise SystemExit(
                "HTML </head> anchor missing"
              )

          if "</body>" not in s:
              raise SystemExit(
                "HTML </body> anchor missing"
              )

          s=s.replace(
            "</head>",
            css+"\n</head>",
            1
          )

          s=s.replace(
            "</body>",
            js+"\n</body>",
            1
          )

          p.write_text(
            s,
            encoding="utf-8"
          )

          print(
            "MTP DIRECT IMAGE VIEWER INSTALLED"
          )
          PY

      - name: Validate app
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          h=Path(
              "index.html"
          ).read_text(
              encoding="utf-8"
          )

          assert (
              "MTP-DIRECT-IMAGE-V1"
              in h
          )

          assert (
              "mtpDirectImageCard"
              in h
          )

          assert (
              "mtpDateSelect"
              in h
          )

          d=json.loads(
              Path(
                  "data/mtp-charta.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          entries=d.get(
              "entries",
              []
          )

          assert entries

          chart=next(
              (
                  x for x in entries
                  if x.get("date")=="2026-10-04"
              ),
              None
          )

          assert chart is not None

          result="".join(
              map(
                  str,
                  chart.get(
                      "numbers",
                      []
                  )
              )
          )

          assert (
              result=="1043981752399685"
          ), (
              "04/10 wrong: "+
              result
          )

          assert (
              chart.get("image_url")
          ), "04/10 image URL missing"

          print(
              "04/10 VERIFIED:",
              "1043 / 9817 / 5239 / 9685"
          )

          print(
              "04/10 IMAGE URL OK"
          )

          print(
              "MTP DIRECT IMAGE VALID ✓"
          )
          PY

      - name: Bump PWA cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path("sw.js")

          if not p.exists():
              print("No sw.js - skipped")
              raise SystemExit(0)

          s=p.read_text(
              encoding="utf-8"
          )

          s2=re.sub(
              r"4d-charta-v[0-9A-Za-z._-]+",
              "4d-charta-v51-mtp-image1",
              s,
              count=1
          )

          if s2!=s:

              p.write_text(
                  s2,
                  encoding="utf-8"
              )

              print(
                  "PWA CACHE BUMPED"
              )

          else:

              print(
                  "PWA CACHE TOKEN NOT FOUND"
              )
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html
          git add data/mtp-charta.json

          if [ -f sw.js ]; then
            git add sw.js
          fi

          if git diff --cached --quiet; then
            echo "NO CHANGES"
            exit 0
          fi

          git commit -m "Add direct MTP chart image to app"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main

          echo "MTP DIRECT IMAGE DEPLOYED"
