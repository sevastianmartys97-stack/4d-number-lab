name: Auto MTP Smart Image V11

"on":
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 2-11 * * *"

permissions:
  contents: write

concurrency:
  group: auto-mtp-smart-image-v11
  cancel-in-progress: true

jobs:
  auto-mtp:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install requests beautifulsoup4 opencv-python-headless numpy

      - name: Check scanner
        run: |
          test -f scripts/update_mtp_charta.py
          echo "V10 base scanner found"

      - name: Patch scanner to try all images
        run: |
          python3 -c '
          from pathlib import Path

          p=Path("scripts/update_mtp_charta.py")
          s=p.read_text(encoding="utf-8")

          old="""if imgs: ps.append((dt,title,url,imgs[0]))"""

          new="""if imgs: ps.append((dt,title,url,imgs))"""

          if old in s:
              s=s.replace(old,new,1)

          old2="""print("ONE CARTA IMAGE:",x[3])
              return x"""

          new2="""print("CANDIDATE IMAGES:",len(x[3]))
              return x"""

          if old2 in s:
              s=s.replace(old2,new2,1)

          old3="""try:dt,title,url,imgurl=latest()
              except Exception as e:
                  print("DISCOVERY FAILED:",e); save_db(db); return

              try:
                  im=decode(get(imgurl).content)
                  cells=detect_16_cells(im)
              except Exception as e:
                  print("VISUAL FETCH/GRID FAILED:",e); cells=None

              if cells is None:
                  print("NO SAVE - clean DB kept"); save_db(db); return"""

          new3="""try:dt,title,url,imgurls=latest()
              except Exception as e:
                  print("DISCOVERY FAILED:",e); save_db(db); return

              cells=None
              imgurl=None

              if isinstance(imgurls,str):
                  imgurls=[imgurls]

              for i,candidate in enumerate(imgurls,1):
                  try:
                      print("TRY IMAGE",str(i)+"/"+str(len(imgurls))+":",candidate)
                      im=decode(get(candidate).content)
                      trial=detect_16_cells(im)

                      if trial is not None and len(trial)==16:
                          cells=trial
                          imgurl=candidate
                          print("CARTA IMAGE SELECTED:",candidate)
                          break

                      print("IMAGE REJECTED - NO VALID 4X4 GRID")

                  except Exception as e:
                      print("IMAGE REJECTED:",e)

              if cells is None:
                  print("NO VALID CARTA IMAGE - CLEAN DB KEPT")
                  save_db(db)
                  return"""

          if old3 in s:
              s=s.replace(old3,new3,1)
          else:
              raise SystemExit("MAIN PATCH TARGET NOT FOUND")

          p.write_text(s,encoding="utf-8")
          print("V11 PATCH INSTALLED")
          '

      - name: Check Python syntax
        run: |
          python3 -m py_compile scripts/update_mtp_charta.py
          echo "PYTHON SYNTAX OK"

      - name: Run V11 scanner
        run: |
          python3 scripts/update_mtp_charta.py

      - name: Validate database
        run: |
          python3 -c '
          import json
          from pathlib import Path

          p=Path("data/mtp-charta.json")
          assert p.exists(),"Database missing"

          d=json.loads(p.read_text(encoding="utf-8"))
          e=d.get("entries",[])

          assert e,"No entries"
          assert all(len(x.get("numbers",[]))==16 for x in e),"Invalid MTP data"

          print("LATEST:",e[0]["date"],"".join(map(str,e[0]["numbers"])))
          print("DATABASE VALID")
          '

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/mtp-charta.json

          if git diff --cached --quiet; then
            echo "No database changes"
            exit 0
          fi

          git commit -m "Auto MTP V11 update"
          git pull --rebase origin main
          git push origin HEAD:main
