          p=Path("data/mtp-charta.json")
          assert p.exists()
          d=json.loads(p.read_text())
          es=d.get("entries",[])
          assert es and all(len(e.get("numbers",[]))==16 for e in es)
          print("LATEST SAVED:",es[0]["date"],"".join(map(str,es[0]["numbers"])))
          PY

