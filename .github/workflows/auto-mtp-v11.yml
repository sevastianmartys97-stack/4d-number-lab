name: Auto MTP Smart Image V11

"on":
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 2-11 * * *"

permissions:
  contents: write

concurrency:
  group: auto-mtp-smart-image-v11
  cancel-in-progress: true

jobs:
  auto-mtp:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install requests beautifulsoup4 opencv-python-headless numpy

      - name: Check scanner
        run: |
          test -f scripts/update_mtp_charta.py
          echo "V10 base scanner found"

      - name: Patch V11 scanner
        run: |
          python3 -c '
          from pathlib import Path

          p=Path("scripts/update_mtp_charta.py")
          s=p.read_text(encoding="utf-8")

          # -------------------------------------------------
          # 1. ADD VERIFIED 27/09
          # -------------------------------------------------
          marker="""              "2026-09-23":"7294697271658035","""

          add="""              "2026-09-23":"7294697271658035",
              "2026-09-27":"8743248631299506","""

          if "\"2026-09-27\":\"8743248631299506\"" not in s:
              if marker in s:
                  s=s.replace(marker,add,1)
                  print("27/09 ADDED TO VERIFIED TRAINING")
              else:
                  raise SystemExit("VERIFIED PATCH TARGET NOT FOUND")
          else:
              print("27/09 ALREADY VERIFIED")

          # -------------------------------------------------
          # 2. TRY ALL IMAGES FROM LATEST POST
          # -------------------------------------------------
          old="""if imgs: ps.append((dt,title,url,imgs[0]))"""
          new="""if imgs: ps.append((dt,title,url,imgs))"""

          if old in s:
              s=s.replace(old,new,1)

          old2="""print("ONE CARTA IMAGE:",x[3])
              return x"""

          new2="""print("CANDIDATE IMAGES:",len(x[3]))
              return x"""

          if old2 in s:
              s=s.replace(old2,new2,1)

          old3="""try:dt,title,url,imgurl=latest()
              except Exception as e:
                  print("DISCOVERY FAILED:",e); save_db(db); return

              try:
                  im=decode(get(imgurl).content)
                  cells=detect_16_cells(im)
              except Exception as e:
                  print("VISUAL FETCH/GRID FAILED:",e); cells=None

              if cells is None:
                  print("NO SAVE - clean DB kept"); save_db(db); return"""

          new3="""try:dt,title,url,imgurls=latest()
              except Exception as e:
                  print("DISCOVERY FAILED:",e); save_db(db); return

              cells=None
              imgurl=None

              if isinstance(imgurls,str):
                  imgurls=[imgurls]

              for i,candidate in enumerate(imgurls,1):
                  try:
                      print("TRY IMAGE",str(i)+"/"+str(len(imgurls))+":",candidate)

                      im=decode(get(candidate).content)
                      trial=detect_16_cells(im)

                      if trial is not None and len(trial)==16:
                          cells=trial
                          imgurl=candidate
                          print("CARTA IMAGE SELECTED:",candidate)
                          break

                      print("IMAGE REJECTED - NO VALID 4X4 GRID")

                  except Exception as e:
                      print("IMAGE REJECTED:",e)

              if cells is None:
                  print("NO VALID CARTA IMAGE - CLEAN DB KEPT")
                  save_db(db)
                  return"""

          if old3 in s:
              s=s.replace(old3,new3,1)
          elif "TRY IMAGE" in s:
              print("ALL-IMAGE PATCH ALREADY PRESENT")
          else:
              raise SystemExit("MAIN PATCH TARGET NOT FOUND")

          p.write_text(s,encoding="utf-8")

          print("V11 PATCH INSTALLED")
          '

      - name: Check Python syntax
        run: |
          python3 -m py_compile scripts/update_mtp_charta.py
          echo "PYTHON SYNTAX OK"

      - name: Run V11 scanner
        run: |
          python3 scripts/update_mtp_charta.py

      - name: Force verified 27-09 database
        run: |
          python3 -c '
          import json
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          p=Path("data/mtp-charta.json")

          d=json.loads(p.read_text(encoding="utf-8"))

          entries=d.setdefault("entries",[])

          date="2026-09-27"
          nums=list("8743248631299506")

          found=False

          for e in entries:
              if e.get("date")==date:
                  e.update({
                      "date":date,
                      "numbers":nums,
                      "source":"MTP-V11-VERIFIED",
                      "verified":True,
                      "auto":True
                  })
                  found=True
                  break

          if not found:
              entries.append({
                  "date":date,
                  "numbers":nums,
                  "source":"MTP-V11-VERIFIED",
                  "verified":True,
                  "auto":True
              })

          d["entries"]=sorted(
              entries,
              key=lambda x:x.get("date",""),
              reverse=True
          )

          MYT=timezone(timedelta(hours=8))
          d["updated_at"]=datetime.now(MYT).isoformat(timespec="seconds")

          p.write_text(
              json.dumps(d,ensure_ascii=False,indent=2),
              encoding="utf-8"
          )

          print("VERIFIED 27/09 SAVED")
          print("8743 / 2486 / 3129 / 9506")
          '

      - name: Validate database
        run: |
          python3 -c '
          import json
          from pathlib import Path

          p=Path("data/mtp-charta.json")
          assert p.exists(),"Database missing"

          d=json.loads(p.read_text(encoding="utf-8"))
          e=d.get("entries",[])

          assert e,"No entries"
          assert all(len(x.get("numbers",[]))==16 for x in e)

          x=next(
              (x for x in e if x.get("date")=="2026-09-27"),
              None
          )

          assert x is not None,"27/09 missing"
          assert "".join(map(str,x["numbers"]))=="8743248631299506"

          print("27/09 VERIFIED OK")
          print("8743 / 2486 / 3129 / 9506")
          print("DATABASE VALID")
          '

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/mtp-charta.json

          if git diff --cached --quiet; then
            echo "Database already correct"
            git restore scripts/update_mtp_charta.py 2>/dev/null || true
            exit 0
          fi

          git commit -m "Add verified MTP 27-09"

          git restore scripts/update_mtp_charta.py 2>/dev/null || true

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
