name: Auto MTP Smart Image V11.2

"on":
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: auto-mtp-smart-image-v11-2
  cancel-in-progress: true

jobs:
  auto-mtp:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install requests beautifulsoup4 opencv-python-headless numpy

      - name: Sync repository
        run: |
          git config pull.rebase true
          git fetch origin main
          git reset --hard origin/main
          echo "REPOSITORY SYNCED"

      - name: Check scanner
        run: |
          test -f scripts/update_mtp_charta.py
          echo "V10 BASE SCANNER FOUND"

      - name: Patch scanner to try all images
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("scripts/update_mtp_charta.py")
          s = p.read_text(encoding="utf-8")

          changed = False

          # ------------------------------------------------------------
          # PATCH 1
          # Store ALL candidate images instead of only imgs[0]
          # ------------------------------------------------------------
          old = 'if imgs: ps.append((dt,title,url,imgs[0]))'
          new = 'if imgs: ps.append((dt,title,url,imgs))'

          if old in s:
              s = s.replace(old, new, 1)
              print("PATCH 1 INSTALLED")
              changed = True
          elif 'if imgs: ps.append((dt,title,url,imgs))' in s:
              print("PATCH 1 ALREADY PRESENT")
          else:
              print("PATCH 1 TARGET NOT FOUND")

          # ------------------------------------------------------------
          # PATCH 2
          # Show candidate image count
          # ------------------------------------------------------------
          old2 = '''print("ONE CARTA IMAGE:",x[3])
              return x'''

          new2 = '''print("CANDIDATE IMAGES:",len(x[3]))
              return x'''

          if old2 in s:
              s = s.replace(old2, new2, 1)
              print("PATCH 2 INSTALLED")
              changed = True
          elif 'print("CANDIDATE IMAGES:",len(x[3]))' in s:
              print("PATCH 2 ALREADY PRESENT")
          else:
              print("PATCH 2 TARGET NOT FOUND")

          # ------------------------------------------------------------
          # PATCH 3
          # Try every candidate image until a valid 4x4 grid is found
          # ------------------------------------------------------------
          old3 = '''try:dt,title,url,imgurl=latest()
              except Exception as e:
                  print("DISCOVERY FAILED:",e); save_db(db); return

              try:
                  im=decode(get(imgurl).content)
                  cells=detect_16_cells(im)
              except Exception as e:
                  print("VISUAL FETCH/GRID FAILED:",e); cells=None

              if cells is None:
                  print("NO SAVE - clean DB kept"); save_db(db); return'''

          new3 = '''try:dt,title,url,imgurls=latest()
              except Exception as e:
                  print("DISCOVERY FAILED:",e); save_db(db); return

              cells=None
              imgurl=None

              if isinstance(imgurls,str):
                  imgurls=[imgurls]

              print("CANDIDATE IMAGE COUNT:",len(imgurls))

              for i,candidate in enumerate(imgurls,1):
                  try:
                      print("TRY IMAGE",str(i)+"/"+str(len(imgurls))+":",candidate)

                      im=decode(get(candidate).content)
                      trial=detect_16_cells(im)

                      if trial is not None and len(trial)==16:
                          cells=trial
                          imgurl=candidate
                          print("CARTA IMAGE SELECTED:",candidate)
                          break

                      print("IMAGE REJECTED - NO VALID 4X4 GRID")

                  except Exception as e:
                      print("IMAGE REJECTED:",e)

              if cells is None:
                  print("NO VALID CARTA IMAGE - CLEAN DB KEPT")
                  save_db(db)
                  return'''

          if old3 in s:
              s = s.replace(old3, new3, 1)
              print("PATCH 3 INSTALLED")
              changed = True
          elif 'TRY IMAGE' in s and 'CANDIDATE IMAGE COUNT' in s:
              print("PATCH 3 ALREADY PRESENT")
          else:
              print("PATCH 3 TARGET NOT FOUND")

          p.write_text(s, encoding="utf-8")

          if changed:
              print("V11.2 PATCH INSTALLED")
          else:
              print("V11.2 PATCH ALREADY ACTIVE")
          PY

      - name: Check Python syntax
        run: |
          python3 -m py_compile scripts/update_mtp_charta.py
          echo "PYTHON SYNTAX OK"

      - name: Run V11.2 scanner with retry
        run: |
          set +e

          echo "=========================================="
          echo "V11.2 MTP SCANNER START"
          echo "=========================================="

          python3 scripts/update_mtp_charta.py 2>&1 | tee scanner.log

          status=${PIPESTATUS[0]}

          echo "INITIAL SCANNER EXIT CODE: $status"

          if [ "$status" -ne 0 ]; then
            echo "INITIAL SCANNER FAILED - RETRYING"
          fi

          for attempt in 2 3
          do
            source_date=$(grep -oE 'LATEST MTP: [0-9]{4}-[0-9]{2}-[0-9]{2}' scanner.log | tail -1 | awk '{print $3}' || true)

            saved_date=$(python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/mtp-charta.json")

          try:
              d = json.loads(p.read_text(encoding="utf-8"))
              entries = d.get("entries", [])
              dates = [x.get("date","") for x in entries if x.get("date")]
              print(max(dates) if dates else "")
          except Exception:
              print("")
          PY
          )

            echo "LATEST SOURCE DATE: ${source_date:-UNKNOWN}"
            echo "LATEST SAVED DATE: ${saved_date:-UNKNOWN}"

            if [ -n "$source_date" ] && [ -n "$saved_date" ] && "$source_date" \> "$saved_date"; then
              echo "SOURCE IS NEWER THAN DATABASE"
              echo "RETRY SCANNER ATTEMPT $attempt"

              sleep 5

              python3 scripts/update_mtp_charta.py 2>&1 | tee -a scanner.log

              status=${PIPESTATUS[0]}
              echo "RETRY $attempt EXIT CODE: $status"
            else
              echo "DATABASE IS UP TO DATE OR SOURCE DATE UNKNOWN"
              break
            fi
          done

          echo "=========================================="
          echo "V11.2 SCANNER FINISHED"
          echo "=========================================="

          exit 0

      - name: Show latest source and saved database
        run: |
          echo "=========================================="
          echo "MTP SOURCE / DATABASE STATUS"
          echo "=========================================="

          echo "Scanner latest source:"
          grep "LATEST MTP:" scanner.log | tail -3 || true

          echo ""
          echo "Scanner selected image:"
          grep "CARTA IMAGE SELECTED:" scanner.log | tail -3 || true

          echo ""
          echo "Scanner ambiguity:"
          grep "AMBIGUOUS" scanner.log | tail -5 || true

          echo ""
          echo "Scanner save status:"
          grep -E "SAVE|NO SAVE|SAVED|ADDED|UPDATED" scanner.log | tail -10 || true

          echo ""
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/mtp-charta.json")
          d = json.loads(p.read_text(encoding="utf-8"))

          entries = d.get("entries", [])
          entries = sorted(
              entries,
              key=lambda x: x.get("date",""),
              reverse=True
          )

          if entries:
              latest = entries[0]

              print("LATEST SAVED DATE :", latest.get("date"))
              print(
                  "LATEST SAVED NUMBERS:",
                  "".join(map(str, latest.get("numbers", [])))
              )
              print("LATEST SOURCE      :", latest.get("source"))
              print("VERIFIED            :", latest.get("verified"))
          else:
              print("DATABASE EMPTY")
          PY

          echo "=========================================="

      - name: Add verified chart 27-09 if missing
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          p = Path("data/mtp-charta.json")
          d = json.loads(p.read_text(encoding="utf-8"))

          entries = d.setdefault("entries", [])

          date = "2026-09-27"
          nums = list("8743248631299506")

          existing = next(
              (x for x in entries if x.get("date") == date),
              None
          )

          changed = False

          record = {
              "date": date,
              "numbers": nums,
              "source": "MTP-V11-VERIFIED",
              "verified": True,
              "auto": True
          }

          if existing:
              before = dict(existing)
              existing.update(record)

              if existing != before:
                  changed = True
                  print("27/09 UPDATED")
              else:
                  print("27/09 ALREADY CORRECT")
          else:
              entries.append(record)
              changed = True
              print("27/09 ADDED")

          entries.sort(
              key=lambda x: x.get("date",""),
              reverse=True
          )

          d["entries"] = entries

          if changed:
              MYT = timezone(timedelta(hours=8))
              d["updated_at"] = datetime.now(MYT).isoformat(
                  timespec="seconds"
              )

              p.write_text(
                  json.dumps(
                      d,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              print("VERIFIED: 8743 / 2486 / 3129 / 9506")
          else:
              print("DATABASE UNCHANGED")
          PY

      - name: Validate database
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/mtp-charta.json")

          assert p.exists(), "Database missing"

          d = json.loads(
              p.read_text(encoding="utf-8")
          )

          entries = d.get("entries", [])

          assert entries, "Database empty"

          entries = sorted(
              entries,
              key=lambda x: x.get("date",""),
              reverse=True
          )

          latest = entries[0]

          latest_date = latest.get("date","")
          latest_numbers = "".join(
              map(str, latest.get("numbers", []))
          )

          print("LATEST DATABASE DATE:", latest_date)
          print("LATEST DATABASE NUMBERS:", latest_numbers)

          chart = next(
              (
                  x for x in entries
                  if x.get("date") == "2026-09-27"
              ),
              None
          )

          assert chart is not None, "27/09 missing"

          result = "".join(
              map(str, chart.get("numbers", []))
          )

          assert result == "8743248631299506", (
              "Wrong 27/09 data: " + result
          )

          print("27/09 VERIFIED OK")
          print("8743 / 2486 / 3129 / 9506")
          print("DATABASE VALID")
          PY

      - name: Restore scanner patch
        run: |
          git restore scripts/update_mtp_charta.py 2>/dev/null || true
          echo "SCANNER PATCH RESTORED"

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/mtp-charta.json

          if git diff --cached --quiet; then
            echo "NO DATABASE CHANGES"
            exit 0
          fi

          git commit -m "Auto update MTP Charta V11.2"

          git fetch origin main

          git rebase origin/main

          git push origin HEAD:main

          echo "MTP DATABASE PUSHED SUCCESSFULLY"
