        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update_mtp_charta.py data/mtp-charta.json data/mtp-visual-templates-v10.npz 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Install Auto MTP Smart Image V11"
          for n in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Push successful"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
