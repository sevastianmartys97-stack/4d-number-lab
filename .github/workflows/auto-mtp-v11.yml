name: Auto MTP Smart Image V11.3

"on":
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: auto-mtp-smart-image-v11-3
  cancel-in-progress: true

jobs:
  auto-mtp:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install requests beautifulsoup4 opencv-python-headless numpy

      - name: Sync repository
        run: |
          git config pull.rebase true
          git fetch origin main
          git reset --hard origin/main
          echo "REPOSITORY SYNCED"

      - name: Check scanner
        run: |
          test -f scripts/update_mtp_charta.py
          echo "V10 BASE SCANNER FOUND"

      - name: Patch scanner
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("scripts/update_mtp_charta.py")
          s = p.read_text(encoding="utf-8")

          changed = False

          # ============================================================
          # PATCH 1
          # Keep ALL candidate images
          # ============================================================

          old = 'if imgs: ps.append((dt,title,url,imgs[0]))'
          new = 'if imgs: ps.append((dt,title,url,imgs))'

          if old in s:
              s = s.replace(old, new, 1)
              print("PATCH 1 INSTALLED")
              changed = True
          elif 'if imgs: ps.append((dt,title,url,imgs))' in s:
              print("PATCH 1 ALREADY PRESENT")
          else:
              print("PATCH 1 TARGET NOT FOUND")

          # ============================================================
          # PATCH 2
          # Candidate image count
          # ============================================================

          old2 = '''print("ONE CARTA IMAGE:",x[3])
              return x'''

          new2 = '''print("CANDIDATE IMAGES:",len(x[3]))
              return x'''

          if old2 in s:
              s = s.replace(old2, new2, 1)
              print("PATCH 2 INSTALLED")
              changed = True
          elif 'print("CANDIDATE IMAGES:",len(x[3]))' in s:
              print("PATCH 2 ALREADY PRESENT")
          else:
              print("PATCH 2 TARGET NOT FOUND")

          # ============================================================
          # PATCH 3
          # Try ALL candidate images
          # ============================================================

          old3 = '''try:dt,title,url,imgurl=latest()
              except Exception as e:
                  print("DISCOVERY FAILED:",e); save_db(db); return

              try:
                  im=decode(get(imgurl).content)
                  cells=detect_16_cells(im)
              except Exception as e:
                  print("VISUAL FETCH/GRID FAILED:",e); cells=None

              if cells is None:
                  print("NO SAVE - clean DB kept"); save_db(db); return'''

          new3 = '''try:dt,title,url,imgurls=latest()
              except Exception as e:
                  print("DISCOVERY FAILED:",e); save_db(db); return

              cells=None
              imgurl=None

              if isinstance(imgurls,str):
                  imgurls=[imgurls]

              print("CANDIDATE IMAGE COUNT:",len(imgurls))

              for i,candidate in enumerate(imgurls,1):
                  try:
                      print("TRY IMAGE",str(i)+"/"+str(len(imgurls))+":",candidate)

                      im=decode(get(candidate).content)
                      trial=detect_16_cells(im)

                      if trial is not None and len(trial)==16:
                          cells=trial
                          imgurl=candidate
                          print("CARTA IMAGE SELECTED:",candidate)
                          break

                      print("IMAGE REJECTED - NO VALID 4X4 GRID")

                  except Exception as e:
                      print("IMAGE REJECTED:",e)

              if cells is None:
                  print("NO VALID CARTA IMAGE - CLEAN DB KEPT")
                  save_db(db)
                  return'''

          if old3 in s:
              s = s.replace(old3, new3, 1)
              print("PATCH 3 INSTALLED")
              changed = True
          elif 'TRY IMAGE' in s and 'CANDIDATE IMAGE COUNT' in s:
              print("PATCH 3 ALREADY PRESENT")
          else:
              print("PATCH 3 TARGET NOT FOUND")

          # ============================================================
          # PATCH 4
          # Allow 15/16 valid cells
          #
          # Original V10/V11 rejected the entire chart if one cell
          # was invalid.
          #
          # New rule:
          # - 16 cells required
          # - minimum 15 valid cells
          # - minimum separation 1.00
          # ============================================================

          marker = 'MULTI MATCH AMBIGUOUS - NO SAVE'

          if marker in s and 'V11.3 MIN VALID CELLS' not in s:

              old4 = '''if not all(cell_valid):
                  print("MULTI MATCH AMBIGUOUS - NO SAVE")
                  save_db(db)
                  return'''

              new4 = '''valid_count=sum(1 for x in cell_valid if x)

              try:
                  min_sep=min(
                      float(x)
                      for x in separations
                      if x is not None
                  )
              except Exception:
                  min_sep=0.0

              print("V11.3 VALID CELL COUNT:",valid_count,"/16")
              print("V11.3 MIN VALID CELLS: 15")
              print("V11.3 MIN SEPARATION:",min_sep)

              if valid_count < 15:
                  print("MULTI MATCH AMBIGUOUS - TOO MANY INVALID CELLS")
                  save_db(db)
                  return

              if min_sep < 1.00:
                  print("MULTI MATCH AMBIGUOUS - LOW SEPARATION")
                  save_db(db)
                  return

              if valid_count == 15:
                  print("V11.3 ACCEPTED: 15/16 VALID CELLS")

              if valid_count == 16:
                  print("V11.3 ACCEPTED: 16/16 VALID CELLS")'''

              if old4 in s:
                  s=s.replace(old4,new4,1)
                  print("PATCH 4 INSTALLED")
                  changed=True
              else:
                  print("PATCH 4 TARGET NOT FOUND")

          else:
              print("PATCH 4 ALREADY PRESENT OR TARGET NOT FOUND")

          p.write_text(s,encoding="utf-8")

          if changed:
              print("V11.3 PATCH INSTALLED")
          else:
              print("V11.3 PATCH ALREADY ACTIVE")
          PY

      - name: Check Python syntax
        run: |
          python3 -m py_compile scripts/update_mtp_charta.py
          echo "PYTHON SYNTAX OK"

      - name: Run V11.3 scanner
        run: |
          echo "=========================================="
          echo "V11.3 MTP SCANNER START"
          echo "=========================================="

          python3 scripts/update_mtp_charta.py | tee scanner.log

          status=${PIPESTATUS[0]}

          echo "SCANNER EXIT CODE: $status"

          if [ "$status" -ne 0 ]; then
            echo "SCANNER RETURNED ERROR"
          fi

          echo "=========================================="
          echo "V11.3 SCANNER FINISHED"
          echo "=========================================="

          exit 0

      - name: Validate latest MTP
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime

          p=Path("data/mtp-charta.json")

          if not p.exists():
              raise SystemExit("DATABASE MISSING")

          d=json.loads(
              p.read_text(encoding="utf-8")
          )

          entries=d.get("entries",[])

          if not entries:
              raise SystemExit("DATABASE EMPTY")

          entries=sorted(
              entries,
              key=lambda x:x.get("date",""),
              reverse=True
          )

          latest=entries[0]

          print("==========================================")
          print("LATEST SAVED DATE:",latest.get("date"))
          print(
              "LATEST SAVED NUMBERS:",
              "".join(map(str,latest.get("numbers",[])))
          )
          print("LATEST SOURCE:",latest.get("source"))
          print("VERIFIED:",latest.get("verified"))
          print("==========================================")

          # Show 04/10 if present
          chart=next(
              (
                  x for x in entries
                  if x.get("date")=="2026-10-04"
              ),
              None
          )

          if chart:
              result="".join(
                  map(str,chart.get("numbers",[]))
              )

              print("04/10 FOUND IN DATABASE")
              print("04/10 RESULT:",result)
              print("04/10 SOURCE:",chart.get("source"))
          else:
              print("04/10 NOT YET IN DATABASE")
          PY

      - name: Keep verified 27-09
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          p=Path("data/mtp-charta.json")

          d=json.loads(
              p.read_text(encoding="utf-8")
          )

          entries=d.setdefault("entries",[])

          date="2026-09-27"
          nums=list("8743248631299506")

          existing=next(
              (
                  x for x in entries
                  if x.get("date")==date
              ),
              None
          )

          record={
              "date":date,
              "numbers":nums,
              "source":"MTP-V11-VERIFIED",
              "verified":True,
              "auto":True
          }

          if existing:
              existing.update(record)
              print("27/09 VERIFIED RECORD KEPT")
          else:
              entries.append(record)
              print("27/09 VERIFIED RECORD RESTORED")

          entries.sort(
              key=lambda x:x.get("date",""),
              reverse=True
          )

          d["entries"]=entries

          MYT=timezone(timedelta(hours=8))

          d["updated_at"]=datetime.now(
              MYT
          ).isoformat(
              timespec="seconds"
          )

          p.write_text(
              json.dumps(
                  d,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("27/09 = 8743 / 2486 / 3129 / 9506")
          PY

      - name: Validate database
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p=Path("data/mtp-charta.json")

          assert p.exists(),"Database missing"

          d=json.loads(
              p.read_text(encoding="utf-8")
          )

          entries=d.get("entries",[])

          assert entries,"Database empty"

          chart=next(
              (
                  x for x in entries
                  if x.get("date")=="2026-09-27"
              ),
              None
          )

          assert chart is not None,"27/09 missing"

          result="".join(
              map(str,chart.get("numbers",[]))
          )

          assert result=="8743248631299506",(
              "Wrong 27/09 data: "+result
          )

          print("27/09 VERIFIED OK")
          print("8743 / 2486 / 3129 / 9506")
          print("DATABASE VALID")
          PY

      - name: Restore scanner patch
        run: |
          git restore scripts/update_mtp_charta.py 2>/dev/null || true
          echo "SCANNER PATCH RESTORED"

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/mtp-charta.json

          if git diff --cached --quiet; then
            echo "NO DATABASE CHANGES"
            exit 0
          fi

          git commit -m "Auto update MTP Charta V11.3"

          git fetch origin main

          git rebase origin/main

          git push origin HEAD:main

          echo "MTP DATABASE PUSHED SUCCESSFULLY"
