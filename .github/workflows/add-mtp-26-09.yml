name: Auto MTP Smart Image V11 FIX

"on":
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 2-11 * * *"

permissions:
  contents: write

concurrency:
  group: auto-mtp-smart-image-v11
  cancel-in-progress: true

jobs:
  auto-mtp:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: pip install requests beautifulsoup4 opencv-python-headless numpy

      - name: Check V10 scanner exists
        run: |
          test -f scripts/update_mtp_charta.py
          echo "Base scanner found"

      - name: Create V11 smart-image wrapper
        run: |
          cat > /tmp/run_v11.py <<'PY'
          import importlib.util
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup

          spec = importlib.util.spec_from_file_location("mtp", "scripts/update_mtp_charta.py")
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)

          def latest_smart():
              feed = m.get(m.FEED).json()
              posts = []

              for e in feed.get("feed", {}).get("entry", []):
                  title = e.get("title", {}).get("$t", "")
                  dt = m.pdate(title)
                  if not dt or "CARTA" not in title.upper():
                      continue

                  url = next(
                      (x.get("href", "") for x in e.get("link", [])
                       if x.get("rel") == "alternate"),
                      ""
                  )

                  body = (
                      e.get("content", {}).get("$t", "")
                      or e.get("summary", {}).get("$t", "")
                  )
                  soup = BeautifulSoup(body, "html.parser")

                  imgs = []
                  for im in soup.find_all("img"):
                      u = im.get("data-original") or im.get("data-src") or im.get("src")
                      if u:
                          u = m.big(urljoin(url or m.BASE, u))
                          if u not in imgs:
                              imgs.append(u)

                  if imgs:
                      posts.append((dt, title, url, imgs))

              if not posts:
                  raise RuntimeError("No MTP carta found")

              dt, title, url, imgs = sorted(
                  posts, key=lambda x: x[0], reverse=True
              )[0]

              print("LATEST MTP:", dt, title)
              print("CANDIDATE IMAGES:", len(imgs))

              for i, imgurl in enumerate(imgs, 1):
                  try:
                      print(f"TRY IMAGE {i}/{len(imgs)}:", imgurl)
                      im = m.decode(m.get(imgurl).content)
                      cells = m.detect_16_cells(im)

                      if cells is not None and len(cells) == 16:
                          print("CARTA IMAGE SELECTED:", imgurl)
                          return dt, title, url, imgurl
