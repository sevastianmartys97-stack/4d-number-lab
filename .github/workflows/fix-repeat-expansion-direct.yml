name: Fix Repeat Expansion Direct

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-repeat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply direct repeat fix
        run: python scripts/fix_repeat_expansion_direct.py

      - name: Commit changes
        run: |
          git config user.name "4D App Updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix repeat expansion direct"
            git push
          fi
