name: Apply V4.6.1 Mobile Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v461:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply V4.6.1 Mobile Fix
        run: python scripts/apply_v461_mobile_fix.py

      - name: Save V4.6.1
        run: |
          git config user.name "4D App Updater"
          git config user.email "actions@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix V4.6 mobile layout breakpoint"
            git push
          fi
