name: Add AABC To Full Repeat Family

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-aabc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add AABC family into existing Full Repeat panel
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path("index.html")
          sw = Path("sw.js")

          if not index.exists():
              raise SystemExit("ERROR: index.html tidak dijumpai")

          s = index.read_text(encoding="utf-8")

          marker = "/* FULL-REPEAT-AABC-V3 */"
          if marker in s:
              print("Patch FULL REPEAT AABC V3 sudah ada. Tiada perubahan.")
          else:
              # Must be applied on top of the stable V2 structure.
              if "FULL-REPEAT-STABLE-V2" not in s:
                  raise SystemExit("ERROR: FULL-REPEAT-STABLE-V2 tidak ditemui. Jalankan fix stable sebelum patch ini.")

              # 1) Expand signature so it reacts to both AAAB and AABC family changes.
              old_sig = 'const sig=digits.join("")+"|"+families.map(x=>x.base).join(",");'
              new_sig = '''const aabcFamilies=[];
            tripleDigits.forEach(rep=>{
              const others=partnerDigits.filter(d=>d!==rep);
              for(let i=0;i<others.length;i++){
                for(let j=i+1;j<others.length;j++){
                  const d1=others[i],d2=others[j];
                  const base=rep+rep+d1+d2;
                  aabcFamilies.push({
                    base,
                    rep,
                    d1,
                    d2,
                    perms:getPermutations(base)
                  });
                }
              }
            });

            const sig=digits.join("")+"|AAAB:"+families.map(x=>x.base).join(",")+"|AABC:"+aabcFamilies.map(x=>x.base).join(",");'''
              if old_sig not in s:
                  raise SystemExit("ERROR: signature stable V2 tidak ditemui.")
              s = s.replace(old_sig, new_sig, 1)

              # 2) Replace familyHtml with grouped AAAB + AABC, inside same SHOW panel.
              family_re = re.compile(
                  r'''  const familyHtml=families\.length
              \? '<details class="v5FullRepeatStable">'.*?
              : '';''',
                  re.S
              )

              new_family = r'''  /* FULL-REPEAT-AABC-V3 */
            const aaabHtml=families.length
              ? '<div class="v5RepeatSectionLabel">AAAB FAMILY • ×4</div>'+
                '<div class="v5FullRepeatStableBody">'+
                  families.map(fam=>
                    '<div class="v5FamilyStable">'+
                      '<div class="v5FamilyStableHead">'+
                        '<span class="v5FamilyStableNum">'+fam.base+'</span>'+
                        '<span class="v5FamilyStableMeta">TRIPLE '+fam.rep+' + '+fam.partner+' • ×'+fam.perms.length+'</span>'+
                      '</div>'+
                      '<div class="v5FamilyStablePerms">'+
                        fam.perms.map(p=>'<span>'+p+'</span>').join("")+
                      '</div>'+
                    '</div>'
                  ).join("")+
                '</div>'
              : '';

            const aabcHtml=aabcFamilies.length
              ? '<div class="v5RepeatSectionLabel">AABC FAMILY • ×12</div>'+
                '<div class="v5FullRepeatStableBody">'+
                  aabcFamilies.map(fam=>
                    '<div class="v5FamilyStable v5FamilyAabc">'+
                      '<div class="v5FamilyStableHead">'+
                        '<span class="v5FamilyStableNum">'+fam.base+'</span>'+
                        '<span class="v5FamilyStableMeta">PAIR '+fam.rep+' + '+fam.d1+' + '+fam.d2+' • ×'+fam.perms.length+'</span>'+
                      '</div>'+
                      '<div class="v5FamilyStablePerms">'+
                        fam.perms.map(p=>'<span>'+p+'</span>').join("")+
                      '</div>'+
                    '</div>'
                  ).join("")+
                '</div>'
              : '';

            const familyHtml=(families.length||aabcFamilies.length)
              ? '<details class="v5FullRepeatStable">'+
                  '<summary><span>FULL REPEAT FAMILY SCAN</span><b>SHOW ▼</b></summary>'+
                  aaabHtml+
                  aabcHtml+
                '</details>'
              : '';'''

              s, n = family_re.subn(new_family, s, count=1)
              if n != 1:
                  raise SystemExit("ERROR: familyHtml stable V2 tidak ditemui.")

              # 3) Add compact labels, no new panel.
              css_add = r'''
          <style>
          /* FULL-REPEAT-AABC-V3 */
          #v5Repeat .v5RepeatSectionLabel{
            padding:9px 9px 5px;
            color:#8fa4b4;
            font-size:8px;
            font-weight:800;
            letter-spacing:.08em;
          }
          #v5Repeat .v5FamilyAabc .v5FamilyStableNum{
            color:#ffd777;
          }
          </style>
          '''
              if "</head>" not in s:
                  raise SystemExit("ERROR: </head> tidak dijumpai.")
              s = s.replace("</head>", css_add + "\n</head>", 1)

              index.write_text(s, encoding="utf-8")
              print("FULL REPEAT AABC V3 installed ✓")
              print("AAAB + AABC now share the same SHOW panel ✓")
              print("No extra screen-height when collapsed ✓")
              print("V5.0 STABLE unchanged ✓")

              if sw.exists():
                  t = sw.read_text(encoding="utf-8")
                  t2, n = re.subn(
                      r'const CACHE = "4d-charta-v500[^"]*";',
                      'const CACHE = "4d-charta-v500-fullrepeat-aabc3";',
                      t,
                      count=1
                  )
                  if n:
                      sw.write_text(t2, encoding="utf-8")
                      print("PWA cache bumped ✓")


      - name: Commit changes
        run: |
          git config user.name "4D App Updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add AABC family to Full Repeat scan"
            git push
          fi
