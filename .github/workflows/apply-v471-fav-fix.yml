name: Apply V4.7.1 Favourite Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v471:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply V4.7.1 Favourite Fix
        run: python scripts/apply_v471_fav_fix.py

      - name: Save V4.7.1
        run: |
          git config user.name "4D App Updater"
          git config user.email "actions@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix V4.7 favourite add keyboard"
            git push
          fi
