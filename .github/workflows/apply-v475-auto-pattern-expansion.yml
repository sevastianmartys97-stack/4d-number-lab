name: Apply V4.7.5 Auto Pattern Expansion

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v475:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply V4.7.5
        run: python scripts/apply_v475_auto_pattern_expansion.py

      - name: Save
        run: |
          git config user.name "4D App Updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add V4.7.5 auto pattern permutation expansion"
            git push
          fi
