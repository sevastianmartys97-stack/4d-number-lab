name: Apply V4.7.2 History Position First

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v472:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply V4.7.2
        run: python scripts/apply_v472_history_position.py

      - name: Save V4.7.2
        run: |
          git config user.name "4D App Updater"
          git config user.email "actions@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Move history position before latest date"
            git push
          fi
