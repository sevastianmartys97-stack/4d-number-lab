name: Fix History Summary And Medals

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-history-summary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply Summary Sort And Medals
        run: python scripts/fix_history_summary_medals.py

      - name: Save
        run: |
          git config user.name "4D App Updater"
          git config user.email "actions@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Sort market history summary and add medals"
            git push
          fi
