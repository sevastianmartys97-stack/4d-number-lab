name: Fix Favourite Pattern Match V4 Fixed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index
        shell: bash
        run: |
          cat > /tmp/patch_v4.py <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          # Remove the wrong V3 digit-count fallback, if installed.
          s = re.sub(
              r'\n\s*// FAV-CHARTA-DIGIT-HIT-V3.*?\n\s*return\{hit:false,best:null,type:null,pattern:exactPattern,patternMatch:null\};',
              '\n  return{hit:false,best:null,type:null,pattern:exactPattern,patternMatch:null};',
              s,
              count=1,
              flags=re.S
          )

          marker = "FAV-AUTO-PATTERN-V4-FIXED"
          if marker in s:
              print("V4 FIXED already installed")
              raise SystemExit(0)

          anchor = "  const exactPattern=analyzeChartaPattern(number);"
          if anchor not in s:
              raise SystemExit("ERROR: checkCharta anchor not found")

          block = '''  // FAV-AUTO-PATTERN-V4-FIXED
            // Favourite is checked against the real numbers generated by Auto Chart Pattern.
            const autoExact=chartLines.find(x=>x.number===number);
            if(autoExact){
              const ap=analyzeChartaPattern(number);
              return{
                hit:true,
                best:number,
                type:"EXACT • "+autoExact.type,
                pattern:ap,
                patternMatch:"EXACT"
              };
            }

            for(const perm of getPermutations(number)){
              if(perm===number) continue;
              const found=chartLines.find(x=>x.number===perm);
              if(found){
                const ap=analyzeChartaPattern(perm);
                return{
                  hit:true,
                  best:perm,
                  type:"PUSINGAN • "+found.type,
                  pattern:ap,
                  patternMatch:"PUSINGAN"
                };
              }
            }

            const exactPattern=analyzeChartaPattern(number);'''

          s = s.replace(anchor, block, 1)
          p.write_text(s, encoding="utf-8")
          print("V4 FIXED installed")
          PY
          python3 /tmp/patch_v4.py

      - name: Validate
        shell: bash
        run: |
          grep -q 'FAV-AUTO-PATTERN-V4-FIXED' index.html
          grep -q 'chartLines.find(x=>x.number===number)' index.html
          grep -q 'getPermutations(number)' index.html
          if grep -q 'FAV-CHARTA-DIGIT-HIT-V3' index.html; then
            echo "ERROR: old V3 still present"
            exit 1
          fi
          echo "VALID"

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Fix Favourite Auto Chart Pattern matching"
          git pull --rebase origin main
          git push origin HEAD:main
