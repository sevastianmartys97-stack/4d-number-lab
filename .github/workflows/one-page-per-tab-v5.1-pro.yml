name: One Page Per Tab V5.1 PRO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-tabs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch one-page-per-tab navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("index.html")
          if not p.exists():
              raise SystemExit("index.html not found")

          s = p.read_text(encoding="utf-8")

          MARK = "ONE-PAGE-PER-TAB-V1"
          if MARK in s:
              print("Patch already installed")
              raise SystemExit(0)

          css = r'''
          <style>
          /* ONE-PAGE-PER-TAB-V1 */
          @media(max-width:1100px){
            body.v46-ui .vTabHidden{display:none!important}
            #v51ResultsPage.vTabHidden,
            #vPowerGeneratorPage.vTabHidden,
            #powerGeneratorPage.vTabHidden{display:none!important}
            #v51ResultsPage.vTabVisible,
            #vPowerGeneratorPage.vTabVisible,
            #powerGeneratorPage.vTabVisible{display:block!important}
          }
          </style>
          '''

          js = r'''
          <script>
          /* ONE-PAGE-PER-TAB-V1 */
          (function(){
            "use strict";

            function clean(v){
              return (v||"").replace(/\s+/g," ").trim().toUpperCase();
            }

            function refs(){
              const favBody=document.getElementById("favBody");
              const favCard=favBody ? favBody.closest(".card") : null;
              const cards=[...document.querySelectorAll(".app > .card")];

              const inputCard=cards.find(c=>{
                const u=clean(c.textContent);
                return u.includes("MANUAL CHARTA") || u.includes("AUTO CHARTA") || u.includes("CHARTA LINES");
              }) || cards[0] || null;

              const analysis=document.querySelector(".app > .analysis-card");
              const perm=document.querySelector(".app > .permutation-card");
              const history=document.querySelector(".app > .history-card");
              const footer=document.querySelector(".app > .footer");
              const results=document.getElementById("v51ResultsPage");
              const generator=document.getElementById("vPowerGeneratorPage") ||
                              document.getElementById("powerGeneratorPage");

              return {inputCard,favCard,analysis,perm,history,footer,results,generator};
            }

            function hide(el){
              if(!el)return;
              el.classList.add("vTabHidden");
              el.classList.remove("vTabVisible");
            }

            function show(el){
              if(!el)return;
              el.classList.remove("vTabHidden");
              el.classList.add("vTabVisible");
            }

            function showOnly(tab){
              if(window.innerWidth>1100)return;

              const r=refs();
              const all=[r.inputCard,r.favCard,r.analysis,r.perm,r.history,r.footer,r.results,r.generator];
              all.forEach(hide);

              if(tab==="home"){
                [r.inputCard,r.favCard].forEach(show);
              }else if(tab==="pattern"){
                [r.analysis,r.perm].forEach(show);
              }else if(tab==="history"){
                show(r.history);
              }else if(tab==="generator"){
                show(r.generator);
              }else if(tab==="results"){
                show(r.results);
              }else if(tab==="all"){
                all.forEach(show);
              }

              const nav=document.querySelector(".v46-bottom-nav");
              if(nav){
                nav.querySelectorAll(".v46-nav-btn").forEach(b=>{
                  b.classList.toggle("active",b.dataset.tab===tab);
                });
              }

              window.scrollTo({top:0,behavior:"smooth"});
            }

            function bind(){
              const nav=document.querySelector(".v46-bottom-nav");
              if(!nav)return false;
              if(nav.dataset.onePageBound==="1")return true;

              nav.dataset.onePageBound="1";
              nav.addEventListener("click",function(e){
                const btn=e.target.closest(".v46-nav-btn");
                if(!btn || !btn.dataset.tab)return;
                const tab=btn.dataset.tab;
                setTimeout(()=>showOnly(tab),20);
              },true);

              const active=nav.querySelector(".v46-nav-btn.active");
              showOnly(active?.dataset.tab || "home");
              return true;
            }

            document.addEventListener("DOMContentLoaded",function(){
              let tries=0;
              const t=setInterval(function(){
                tries++;
                if(bind() || tries>100)clearInterval(t);
              },100);
            });
          })();
          </script>
          '''

          if "</head>" not in s or "</body>" not in s:
              raise SystemExit("HTML anchors missing")

          s=s.replace("</head>",css+"\n</head>",1)
          s=s.replace("</body>",js+"\n</body>",1)
          p.write_text(s,encoding="utf-8")

          print("ONE PAGE PER TAB installed ✓")
          PY

      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          assert "ONE-PAGE-PER-TAB-V1" in s
          assert 'tab==="home"' in s
          assert 'tab==="pattern"' in s
          assert 'tab==="history"' in s
          assert 'tab==="generator"' in s
          assert 'tab==="results"' in s
          assert 'tab==="all"' in s
          print("VALID ✓")
          PY

      - name: Bump service worker cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path("sw.js")
          if p.exists():
              s=p.read_text(encoding="utf-8")
              s2=re.sub(r'4d-charta-v[^"\']+', '4d-charta-v51-tabs1', s, count=1)
              if s2==s:
                  s=s.replace("const CACHE_NAME =", "const CACHE_NAME = '4d-charta-v51-tabs1'; // ", 1)
              else:
                  s=s2
              p.write_text(s,encoding="utf-8")
              print("SW cache bumped")
          else:
              print("No sw.js - skipped")
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          [ -f sw.js ] && git add sw.js || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Make mobile tabs one page at a time"
            git push
          fi
