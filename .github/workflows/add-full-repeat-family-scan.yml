name: Add Full Repeat Family Scan

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-full-repeat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add Full Repeat Family Scan
        run: python scripts/add_full_repeat_family_scan.py

      - name: Commit
        run: |
          git config user.name "4D App Updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add compact full repeat family scan"
            git push
          fi
