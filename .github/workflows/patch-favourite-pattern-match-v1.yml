name: Patch Favourite Pattern Match V1
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Favourite to Auto Chart Pattern
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          marker="FAV-PATTERN-MATCH-V1"
          if marker in s:
              print("Patch already installed")
              raise SystemExit(0)
          js='''<script id="FAV-PATTERN-MATCH-V1">
          (() => {
            const nums = el => ((el && el.textContent || "").match(/\\b\\d{4}\\b/g)||[]);
            function patternBox(){
              return [...document.querySelectorAll("section,article,div")]
                .filter(e=>/AUTO CHART(?:A)? PATTERN/i.test(e.textContent||""))
                .sort((a,b)=>(a.textContent||"").length-(b.textContent||"").length)[0]||null;
            }
            function update(){
              const box=patternBox(); if(!box)return;
              const pats=new Set(nums(box));
              document.querySelectorAll("div,li,tr").forEach(row=>{
                if(box.contains(row))return;
                const t=(row.textContent||"").trim();
                if(!/NO MATCH|PATTERN MATCH/i.test(t))return;
                const n=nums(row)[0]; if(!n)return;
                const status=[...row.querySelectorAll("span,b,strong,small,div")].find(e=>{
                  const x=(e.textContent||"").trim().toUpperCase();
                  return x==="NO MATCH"||x==="PATTERN MATCH"||x==="⚡ PATTERN MATCH";
                });
                if(status) status.textContent=pats.has(n)?"⚡ PATTERN MATCH":"NO MATCH";
              });
            }
            let q; const run=()=>{clearTimeout(q);q=setTimeout(update,80)};
            document.addEventListener("DOMContentLoaded",()=>{update();setTimeout(update,400)});
            document.addEventListener("input",run,true);
            document.addEventListener("change",run,true);
            new MutationObserver(run).observe(document.documentElement,{childList:true,subtree:true,characterData:true});
          })();
          </script>'''
          if "</body>" not in s: raise SystemExit("ERROR: </body> not found")
          p.write_text(s.replace("</body>",js+"\\n</body>",1),encoding="utf-8")
          print("FAV-PATTERN-MATCH-V1 installed")
          PY
      - name: Validate
        run: |
          grep -q "FAV-PATTERN-MATCH-V1" index.html
          echo "VALID: Favourite Pattern Match installed"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Connect Favourite to Auto Chart Pattern"
          git pull --rebase origin main
          git push origin HEAD:main
