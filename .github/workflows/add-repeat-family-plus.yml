name: Add Repeat Family Plus

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-repeat-family:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply Repeat Family Plus
        run: python scripts/add_repeat_family_plus.py

      - name: Save
        run: |
          git config user.name "4D App Updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add repeat family expansion"
            git push
          fi
