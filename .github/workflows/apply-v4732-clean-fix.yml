name: Apply V4.7.3.2 Clean Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-clean-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply clean fix
        run: python scripts/apply_v4732_clean_fix.py

      - name: Save
        run: |
          git config user.name "4D App Updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Apply V4.7.3.2 clean DB sticky fix"
            git push
          fi
