name: Apply V4.7 Minimal Mobile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v47:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply V4.7 Minimal Mobile
        run: python scripts/apply_v47_minimal.py

      - name: Save V4.7
        run: |
          git config user.name "4D App Updater"
          git config user.email "actions@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Upgrade UI to V4.7 Minimal Mobile"
            git push
          fi
