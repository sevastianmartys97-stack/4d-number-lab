name: Install V5.1 PRO Auto MTP

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3-10 * * *"

permissions:
  contents: write

jobs:
  v51-pro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y tesseract-ocr
          python3 -m pip install --upgrade pip
          pip install requests beautifulsoup4 opencv-python-headless pytesseract numpy

      - name: Install V5.1 PRO UI
        run: |
          echo "" | base64 -d > /tmp/patch_mtp.py
          python3 /tmp/patch_mtp.py

      - name: Install and run MTP updater
        run: |
          mkdir -p scripts
          echo "" | base64 -d > scripts/update_mtp_charta.py
          python3 scripts/update_mtp_charta.py

      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          h=Path("index.html").read_text(encoding="utf-8")
          assert "V5.1 • PRO" in h
          assert "MTP-AUTO-CHARTA-V1" in h
          assert "MTP-AUTO-CHARTA-JS-V1" in h
          d=json.loads(Path("data/mtp-charta.json").read_text(encoding="utf-8"))
          assert d.get("source")=="CARTAPLANBEE MTP ONLY"
          assert all(len(x.get("numbers",[]))==16 for x in d.get("entries",[]))
          print("V5.1 PRO VALID ✓")
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/mtp-charta.json scripts/update_mtp_charta.py
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Install V5.1 PRO Auto MTP"
            git push
          fi
